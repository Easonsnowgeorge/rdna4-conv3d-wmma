[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdna4-conv3d-wmma"
version = "0.1.0"
description = "Implicit-GEMM Conv3d for AMD RDNA4 (gfx1201) via Triton WMMA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "rdna4-conv3d-wmma contributors" }]
keywords = ["rocm", "rdna4", "gfx1201", "wmma", "conv3d", "triton", "miopen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Easonsnowgeorge/rdna4-conv3d-wmma"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdna4_conv3d = ["*.hip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
